name: Report required validation
description: Report actual validation outcome on the original merge candidate
inputs:
  context:
    description: Exact required status context established by the gate
    required: true
  result:
    description: Aggregate job status after validating its result tuple
    required: true
runs:
  using: composite
  steps:
    - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        REQUIRED_CONTEXT: ${{ inputs.context }}
        VALIDATION_RESULT: ${{ inputs.result }}
      with:
        script: |
          const trustedPr = context.eventName === 'pull_request'
            && context.payload.pull_request.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`
            && context.actor !== 'dependabot[bot]'
            && context.payload.pull_request.user.login !== 'dependabot[bot]';
          if (!trustedPr) return;
          const result = process.env.VALIDATION_RESULT;
          if (!['success', 'failure'].includes(result)) {
            throw new Error('Expected an executed validation result; skipped/cancelled validation cannot pass');
          }
          // Preserve the gate's immutable test-merge SHA and exact required name.
          await github.rest.repos.createCommitStatus({
            ...context.repo,
            sha: context.sha,
            context: process.env.REQUIRED_CONTEXT,
            state: result,
            description: result === 'success' ? 'Required validation passed.' : 'Required validation failed; inspect the workflow.',
            target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`,
          });
